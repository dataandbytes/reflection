<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Reflection</title>
  <meta name="description" content="One deep question a day. You answer in a notebook, not here. No account, nothing saved." />
  <meta name="theme-color" content="#f4ece0" />

  <!-- A quiet serif for the question, a clean sans for everything small. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="stage">
    <header class="masthead">
      <span class="brand">Reflection</span>
      <span class="date" id="date"></span>
    </header>

    <section class="prompt">
      <p class="category" id="category"></p>
      <h1 class="question" id="question">…</h1>
    </section>

    <footer class="ritual">
      <p class="instruction">
        Don't answer here. Take a pen and your notebook,
        and give this the time it asks for.
      </p>
      <button class="link-btn" id="openReminder" type="button">Set a daily time</button>
    </footer>
  </main>

  <!-- Reminder sheet: pick a time, download a recurring calendar reminder. -->
  <div class="sheet-backdrop" id="backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Your daily moment</h2>
      <p class="sheet-copy">
        Choose the time you want to meet yourself each day.
        We'll make a reminder you can drop into your phone's calendar —
        nothing is stored here.
      </p>
      <label class="time-field">
        <span>Time</span>
        <input type="time" id="time" value="21:00" />
      </label>
      <button class="primary-btn" id="downloadIcs" type="button">Add daily reminder to calendar</button>
      <button class="link-btn close" id="closeReminder" type="button">Not now</button>
    </div>
  </div>

  <script src="js/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
